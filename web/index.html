<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam converter</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #66665f;
    --border: #d9d9d2; --accent: #2f5d8a; --accent-text: #ffffff;
    --error: #a3271f; --ok: #2d6a3e; --log-bg: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1a; --panel: #242423; --text: #ecece8; --muted: #a3a39b;
      --border: #3a3a37; --accent: #7fa7d1; --accent-text: #111;
      --error: #f08a80; --ok: #8fd19e; --log-bg: #1f1f1e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 20px; }
  section {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 16px;
  }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  .hint { color: var(--muted); font-size: 0.875rem; margin: 4px 0 0; }
  select, input[type=file] { font: inherit; max-width: 100%; }
  select { padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--panel); color: var(--text); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; }
  .row > div { min-width: 0; }
  button {
    font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 6px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  #status { font-weight: 600; margin: 0 0 8px; }
  #status.error { color: var(--error); }
  #status.ok { color: var(--ok); }
  #log {
    background: var(--log-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
    overflow-wrap: anywhere; max-height: 360px; overflow: auto; margin: 0;
  }
  #downloads a { display: inline-block; margin: 8px 12px 0 0; color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Exam converter</h1>
  <p class="lede">Converts a LaTeX exam to a QTI package for Canvas or a WISEflow JSON item bank, entirely in your browser. Prototype.</p>

  <section>
    <h2>1. Files</h2>
    <label for="files">Problem set and the files it uses</label>
    <input id="files" type="file" multiple accept=".tex,.pdf,.png,.jpg,.jpeg,.json">
    <p class="hint">Select the <code>.tex</code> file plus any figures it includes (e.g. <code>ad-problems-april-2024-figs.pdf</code>).</p>
    <label for="main">Problem set to convert</label>
    <select id="main" disabled><option>No files selected</option></select>
  </section>

  <section>
    <h2>2. Output</h2>
    <div class="row">
      <div>
        <label for="format">Format</label>
        <select id="format">
          <option value="learnosity">WISEflow JSON</option>
          <option value="qti">QTI package for Canvas</option>
          <option value="both">Both</option>
        </select>
      </div>
      <div>
        <label for="language">Language</label>
        <select id="language">
          <option value="da">Danish</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button id="check" class="secondary" disabled>Check</button>
      <button id="convert" disabled>Convert</button>
    </div>
  </section>

  <section>
    <h2>3. Result</h2>
    <p id="status">Loading Python…</p>
    <pre id="log"></pre>
    <div id="downloads"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
